<!doctype html>
<html lang="fil">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Presyo Bantay — araw-araw na presyo sa palengke mula sa DA Bantay Presyo. Daily market prices from DA Bantay Presyo."
    />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="theme-color" content="#0b5d3b" />
    <title>Presyo Bantay</title>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-VL047YCMK8"></script>
    <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-VL047YCMK8');</script>
  </head>
  <body>
    <header class="site-header">
      <div class="wrap">
        <h1 class="brand">
          <picture>
            <source
              type="image/webp"
              srcset="./brand/logo-mark-96.webp 2x, ./brand/logo-mark-144.webp 3x"
            />
            <img
              class="brand-mark"
              src="./brand/logo-mark-96.png"
              srcset="./brand/logo-mark-96.png 2x, ./brand/logo-mark-144.png 3x"
              width="48"
              height="48"
              alt=""
              aria-hidden="true"
              fetchpriority="high"
              decoding="async"
            />
          </picture>
          <span class="brand-text">
            <span class="brand-name">Presyo <span class="gold">Bantay</span></span>
            <span id="tagline" class="tagline"></span>
          </span>
        </h1>
        <div class="lang-toggle" role="group" id="lang-group" aria-label="Wika / Language / 言語">
          <span id="lang-label"></span>
          <button type="button" id="lang-tl">Taglish</button>
          <button type="button" id="lang-en">English</button>
          <button type="button" id="lang-ja">日本語</button>
        </div>
      </div>
    </header>

    <main class="wrap">
      <section class="card" id="deals-card" aria-labelledby="deals-h" hidden>
        <h2 id="deals-h"></h2>
        <p class="hint" id="deals-date"></p>
        <div id="deals-body"></div>
        <p class="hint deals-foot" id="deals-foot"></p>
        <p class="hint"><a id="deals-day-link"></a></p>
      </section>

      <section class="card" id="days-card" aria-labelledby="days-h" hidden>
        <h2 id="days-h"></h2>
        <p><a id="days-latest"></a></p>
        <ul id="days-list" class="days-list"></ul>
        <p><a id="days-all"></a></p>
      </section>

      <section class="card" aria-labelledby="controls-h">
        <h2 id="controls-h" class="visually-hidden">Controls</h2>
        <div class="control-row">
          <label class="control-label" for="commodity" id="commodity-label"></label>
          <select id="commodity"></select>
        </div>
        <fieldset class="control-row">
          <legend id="markets-legend"></legend>
          <div id="market-chips" class="chips"></div>
        </fieldset>
        <div class="control-row range-row">
          <span class="control-label" id="range-label"></span>
          <div class="range-btns" role="group" id="range-group" aria-labelledby="range-label">
            <button type="button" data-range="30">30</button>
            <button type="button" data-range="90">90</button>
            <button type="button" data-range="180">180</button>
            <button type="button" data-range="all" id="range-all"></button>
          </div>
          <label class="fx-check"><input type="checkbox" id="fx-toggle" /> <span id="fx-label"></span></label>
        </div>
      </section>

      <section class="card" aria-labelledby="chart-h">
        <h2 id="chart-h"></h2>
        <p class="hint" id="chart-hint"></p>
        <div id="chart-status" class="status" role="status"></div>
        <div id="chart-readout" class="readout" aria-live="polite"></div>
        <div id="chart"></div>
        <div id="chart-legend" class="chart-legend"></div>
        <div id="chart-empty" class="status"></div>
      </section>

      <section class="card" aria-labelledby="week-h">
        <h2 id="week-h"></h2>
        <p class="hint" id="week-unit"></p>
        <div id="week-body"></div>
      </section>

      <section class="card" aria-labelledby="corr-h">
        <h2 id="corr-h"></h2>
        <p class="hint" id="corr-desc"></p>
        <div class="control-row">
          <label class="control-label" for="corr-market" id="corr-market-label"></label>
          <select id="corr-market"></select>
        </div>
        <div id="corr-body"></div>
        <p class="hint" id="corr-caution"></p>
      </section>
    </main>

    <footer class="site-footer">
      <div class="wrap">
        <p>
          <a href="https://www.da.gov.ph/price-monitoring/" id="foot-source"></a>
        </p>
        <p>
          <a href="https://frankfurter.dev" id="foot-fx"></a>
        </p>
        <p id="foot-stall"></p>
        <p id="foot-unofficial"></p>
        <p id="foot-privacy"></p>
        <p><span id="foot-updated-label"></span> <time id="foot-updated"></time></p>
        <p id="foot-range-note"></p>
        <p><a href="https://github.com/tomohiro-owada/presyo-bantay" rel="noopener" id="foot-code"></a></p>
      </div>
    </footer>

    <noscript>
      <p style="padding: 1rem; text-align: center">
        Kailangan ng JavaScript para maipakita ang chart at presyo. / This site
        needs JavaScript to show charts and prices.
      </p>
    </noscript>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
