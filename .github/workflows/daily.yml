name: daily

on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

jobs:
  update-prices:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: daily-prices
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Fetch and parse latest prices
        run: python -m presyo_bantay fetch --parse

      - name: Ingest snapshots into SQLite
        run: python -m presyo_bantay ingest data/json

      - name: Update USD/PHP rates
        run: python -m presyo_bantay fx-update --db data/presyo.db

      - name: Commit updated JSON and DB
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/json/*.json data/presyo.db
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update price data $(date -u +%F)"
            git push
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build static site
        run: make site

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: site/dist
