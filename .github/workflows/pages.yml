name: pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "data/json/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - uses: actions/configure-pages@v5

      # Site data is committed (site/public/data from `presyo export` on the
      # ingest server); this workflow only builds, never ingests or touches a DB.
      - name: Build static site
        run: |
          if [ ! -f site/public/data/meta.json ]; then
            echo "error: site/public/data/meta.json is missing (run presyo export on the ingest server first)" >&2
            exit 1
          fi
          cd site && npm ci && npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
